<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #a8dcef; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(43, 38, 51, 0.45); color: #fff; cursor: pointer; text-align: center;
      }
      #overlay.hidden { display: none; }
      #overlay h1 { margin: 0 0 calc(12 * var(--u)); font-size: calc(32 * var(--u)); letter-spacing: 0.1em; }
      #world-name { margin-bottom: calc(6 * var(--u)); font-size: calc(15 * var(--u)); font-weight: 700; opacity: 0.75; }
      .overlay-buttons { display: flex; gap: calc(8 * var(--u)); justify-content: center; flex-wrap: wrap; }
      #to-title, #to-avatar, #to-settings {
        margin-top: calc(16 * var(--u)); padding: calc(8 * var(--u)) calc(18 * var(--u)); border: none; border-radius: calc(8 * var(--u)); cursor: pointer;
        font: inherit; font-size: calc(14 * var(--u)); font-weight: 700; color: #fff; background: rgba(255, 255, 255, 0.18);
      }
      #to-title:hover, #to-avatar:hover, #to-settings:hover { background: rgba(255, 255, 255, 0.3); }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: calc(6 * var(--u)); height: calc(6 * var(--u)); margin: calc(-3 * var(--u)) 0 0 calc(-3 * var(--u));
        border-radius: 50%; background: #fff; pointer-events: none;
      }
      #crosshair.hidden { display: none; }
      #pickup-hint {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, calc(28 * var(--u))); pointer-events: none;
        padding: calc(4 * var(--u)) calc(12 * var(--u)); border-radius: calc(6 * var(--u)); background: rgba(43, 38, 51, 0.55);
        color: #fff; font-size: calc(15 * var(--u)); font-weight: 700;
      }
      #pickup-hint.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="overlay" class="hidden">
      <div>
        <div id="world-name"></div>
        <h1>クリックして開始</h1>
        <div class="overlay-buttons">
          <button id="to-avatar">アバター</button>
          <button id="to-settings">設定</button>
          <button id="to-title">セーブしてタイトルへ</button>
        </div>
      </div>
    </div>
    <div id="crosshair"></div>
    <div id="pickup-hint" class="hidden"></div>
    <!-- three と物理エンジン Rapier、マルチプレイの PeerJS は CDN から読み込む（TS 側の import 文はそのまま使える） -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs",
          "peerjs": "https://cdn.jsdelivr.net/npm/peerjs@1.5.5/+esm"
        }
      }
    </script>
    <!-- src/*.ts を tsc でコンパイルした js/main.js を読み込む -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
