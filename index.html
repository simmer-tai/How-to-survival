<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #a8dcef; font-family: system-ui, sans-serif; }
      canvas { display: block; }
      #overlay {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: rgba(43, 38, 51, 0.45); color: #fff; cursor: pointer; text-align: center;
      }
      #overlay.hidden { display: none; }
      #overlay h1 { margin: 0 0 12px; font-size: 32px; letter-spacing: 0.1em; }
      #overlay p { margin: 4px 0; opacity: 0.9; }
      #world-name { margin-bottom: 6px; font-size: 15px; font-weight: 700; opacity: 0.75; }
      #to-title {
        margin-top: 16px; padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer;
        font: inherit; font-size: 14px; font-weight: 700; color: #fff; background: rgba(255, 255, 255, 0.18);
      }
      #to-title:hover { background: rgba(255, 255, 255, 0.3); }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px #2b2633; pointer-events: none;
      }
      #crosshair.hidden { display: none; }
      #pickup-hint {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, 28px); pointer-events: none;
        padding: 4px 12px; border-radius: 6px; background: rgba(43, 38, 51, 0.55);
        color: #fff; font-size: 15px; font-weight: 700;
      }
      #pickup-hint.hidden { display: none; }
    </style>
  </head>
  <body>
    <div id="overlay" class="hidden">
      <div>
        <div id="world-name"></div>
        <h1>クリックして開始</h1>
        <p>WASD：移動 ／ マウス：視点 ／ Shift：走る ／ Ctrl：しゃがむ ／ Space：ジャンプ</p>
        <p>海では泳げる：視線の方向へ W で泳ぐ ／ Space：浮上（水面で岸や桟橋に向かって押すと上がる） ／ C：潜る</p>
        <p>F：拾う・茂みから葉っぱと枝を採取 ／ E・Tab：インベントリ ／ 1〜9・ホイール：アイテム選択 ／ 左クリック：斧を振る（倒した木をさらに叩くとばらせる）</p>
        <p>Q：建築メニュー（左クリック：設置 ／ R：回転 ／ 右クリック：やめる）</p>
        <p>Esc：一時停止（自動でセーブされます）</p>
        <button id="to-title">セーブしてタイトルへ</button>
      </div>
    </div>
    <div id="crosshair"></div>
    <div id="pickup-hint" class="hidden">F：拾う</div>
    <!-- three と物理エンジン Rapier は CDN から読み込む（TS 側の import 文はそのまま使える） -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
          "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
        }
      }
    </script>
    <!-- src/*.ts を tsc でコンパイルした js/main.js を読み込む -->
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
